<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On The Map — New Client Intake (Internal)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#15171C; --paper:#F3F0E8; --paper-2:#EAE5D8;
    --pin:#E8542A; --pin-dark:#C7431D; --ink:#15171C; --ink-soft:#5B5F6B; --line:rgba(21,23,28,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
  header{background:var(--asphalt);color:var(--paper);padding:18px 24px;}
  .wordmark{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.04em;display:flex;align-items:center;gap:8px;}
  .wordmark .dot{width:8px;height:8px;border-radius:50%;background:var(--pin);}
  .wrap{max-width:640px;margin:0 auto;padding:36px 24px 60px;}
  h1{font-family:'Bebas Neue',sans-serif;font-size:34px;margin:0 0 6px;}
  .sub{color:var(--ink-soft);font-size:14px;margin-bottom:28px;}
  .ticket{background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px;box-shadow:0 18px 40px -28px rgba(21,23,28,0.35);}
  .field{margin-bottom:18px;}
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
  .field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .field input, .field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:3px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;background:#FCFBF8;color:var(--ink);}
  .field textarea{resize:vertical;min-height:56px;}
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--pin);}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--pin);margin:26px 0 12px;border-top:1px solid var(--line);padding-top:20px;}
  .section-label:first-child{margin-top:0;border-top:none;padding-top:0;}
  .kw-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .kw-row span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);width:18px;}
  .submit-btn{width:100%;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14.5px;background:var(--pin);color:var(--paper);border:none;padding:15px;border-radius:3px;cursor:pointer;}
  .submit-btn:hover{background:var(--pin-dark);}
  .submit-btn:disabled{background:#B9BCC4;}
  .msg{margin-top:16px;padding:14px 16px;border-radius:3px;font-size:14px;display:none;}
  .msg.show{display:block;}
  .msg.success{background:rgba(47,143,91,0.1);color:#1E6640;border:1px solid rgba(47,143,91,0.3);}
  .msg.error{background:rgba(199,67,29,0.08);color:var(--pin-dark);border:1px solid rgba(199,67,29,0.3);}
</style>
</head>
<body>

<header><div class="wordmark"><span class="dot"></span>ON THE MAP</div></header>

<div class="wrap">
  <h1>New Client Intake</h1>
  <div class="sub">Internal only. Submitting this sends the client their setup email and adds them to all active automations.</div>

  <div class="ticket">
    <form id="intakeForm" novalidate>

      <div class="section-label">Business Basics</div>
      <div class="field">
        <label for="business_name">Business name (exactly as it should appear)</label>
        <input type="text" id="business_name" required>
      </div>
      <div class="field">
        <label for="address">Address (street, city, state)</label>
        <input type="text" id="address" required>
      </div>
      <div class="field">
        <label for="client_email">Client email</label>
        <input type="email" id="client_email" required>
      </div>

      <div class="section-label">Context for AI-Generated Content</div>
      <div class="field">
        <label for="industry_context">Industry context (services, specialties — used in reports, review responses, posts)</label>
        <textarea id="industry_context" required></textarea>
      </div>
      <div class="field">
        <label for="brand_voice">Brand voice notes</label>
        <textarea id="brand_voice" required></textarea>
      </div>

      <div class="section-label">Tracked Search Phrases (1 required, up to 5)</div>
      <div class="kw-row"><span>1</span><input type="text" id="keyword_1" required></div>
      <div class="kw-row"><span>2</span><input type="text" id="keyword_2"></div>
      <div class="kw-row"><span>3</span><input type="text" id="keyword_3"></div>
      <div class="kw-row"><span>4</span><input type="text" id="keyword_4"></div>
      <div class="kw-row"><span>5</span><input type="text" id="keyword_5"></div>

      <button type="submit" class="submit-btn" id="submitBtn">Onboard This Client</button>
      <div class="msg" id="formMsg"></div>
    </form>
  </div>
</div>

<script>
  const WEBHOOK_URL = "https://hook.us2.make.com/13cso87rufdhnr9q61n0qq6yb5v5v472";
  const form = document.getElementById('intakeForm');
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('formMsg');

  function showMsg(text, type){ msg.textContent = text; msg.className = 'msg show ' + type; }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    msg.className = 'msg';

    const payload = {
      business_name: document.getElementById('business_name').value.trim(),
      address: document.getElementById('address').value.trim(),
      client_email: document.getElementById('client_email').value.trim(),
      industry_context: document.getElementById('industry_context').value.trim(),
      brand_voice: document.getElementById('brand_voice').value.trim(),
      keyword_1: document.getElementById('keyword_1').value.trim(),
      keyword_2: document.getElementById('keyword_2').value.trim(),
      keyword_3: document.getElementById('keyword_3').value.trim(),
      keyword_4: document.getElementById('keyword_4').value.trim(),
      keyword_5: document.getElementById('keyword_5').value.trim()
    };

    if (!payload.business_name || !payload.address || !payload.client_email || !payload.industry_context || !payload.brand_voice || !payload.keyword_1) {
      showMsg("Please fill in all required fields (including at least keyword 1).", "error");
      return;
    }

    btn.disabled = true; btn.textContent = "Sending...";

    try {
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        body: new URLSearchParams(payload)
      });
      showMsg("Client onboarded — setup email sent to " + payload.client_email + ".", "success");
      form.reset();
    } catch (err) {
      showMsg("Something went wrong. Try again in a moment.", "error");
    } finally {
      btn.disabled = false; btn.textContent = "Onboard This Client";
    }
  });
</script>

</body>
</html>
