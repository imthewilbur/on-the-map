<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pack Rank — Client Pipeline</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
  :root{
    --asphalt:#15171C;
    --asphalt-2:#1E2128;
    --paper:#F3F0E8;
    --paper-2:#EAE5D8;
    --pin:#E8542A;
    --pin-dark:#C7431D;
    --found:#2F8F5B;
    --warn:#C7431D;
    --ink:#15171C;
    --ink-soft:#5B5F6B;
    --line:rgba(21,23,28,0.12);
    --line-dark:rgba(243,240,232,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Bebas Neue',sans-serif;letter-spacing:0.01em;margin:0;line-height:0.95;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}

  header{background:var(--asphalt);color:var(--paper);border-bottom:1px solid var(--line-dark);}
  .header-row{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;}
  .wordmark img{height:32px;width:auto;display:block;}
  .header-title{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#8B8F9C;letter-spacing:0.05em;}

  .board{padding:32px 28px 80px;max-width:1400px;margin:0 auto;}
  .board-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:28px;}
  .board-head h1{font-size:clamp(28px,4vw,40px);}
  .refresh-note{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .refresh-note button{
    font-family:'IBM Plex Mono',monospace;font-size:12px;background:none;border:1px solid var(--line);
    border-radius:3px;padding:6px 12px;cursor:pointer;color:var(--ink);margin-left:8px;
  }
  .refresh-note button:hover{border-color:var(--pin);color:var(--pin);}

  .columns{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start;}
  .column{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .column-head{
    padding:16px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .column-head h2{font-size:20px;}
  .column-head .count{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
    background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:2px 9px;
  }
  .column.leads .column-head{border-bottom-color:var(--route,#2B4C7E);}
  .column.active .column-head{border-bottom-color:var(--found);}
  .column.paused .column-head{border-bottom-color:var(--warn);}
  .column-body{padding:14px;display:flex;flex-direction:column;gap:12px;min-height:60px;}
  .empty-msg{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);padding:14px 6px;}

  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:16px 16px 14px;
  }
  .card-name{font-weight:600;font-size:15px;margin-bottom:4px;}
  .card-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:10px;word-break:break-word;}
  .card-flag{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.04em;
    padding:2px 7px;border-radius:2px;margin-bottom:10px;text-transform:uppercase;
  }
  .card-flag.ok{background:rgba(47,143,91,0.12);color:var(--found);}
  .card-flag.missing{background:rgba(199,67,29,0.1);color:var(--warn);}
  .card-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);
    padding:7px 11px;border-radius:3px;cursor:pointer;transition:all 0.12s ease;
  }
  .btn:hover{border-color:var(--pin);color:var(--pin);}
  .btn.primary{background:var(--pin);border-color:var(--pin);color:var(--paper);}
  .btn.primary:hover{background:var(--pin-dark);color:var(--paper);}
  .btn.danger:hover{border-color:var(--warn);color:var(--warn);}

  .convert-form{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:none;}
  .convert-form.show{display:block;}
  .convert-form label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin-bottom:4px;margin-top:10px;}
  .convert-form input,.convert-form textarea{
    width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:3px;
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;background:#FCFBF8;color:var(--ink);
  }
  .convert-form textarea{resize:vertical;min-height:50px;}
  .convert-form .kw-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--asphalt);color:var(--paper);padding:12px 22px;border-radius:4px;
    font-family:'IBM Plex Mono',monospace;font-size:13px;opacity:0;transition:all 0.2s ease;
    pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.error{background:var(--warn);}

  .loading-msg{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);padding:40px;text-align:center;}

  @media (max-width:900px){
    .columns{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <a href="#" class="wordmark"><img src="/assets/logo.png" alt="Pack Rank"></a>
    <div class="header-title">CLIENT PIPELINE</div>
  </div>
</header>

<div class="board">
  <div class="board-head">
    <h1>Client Pipeline</h1>
    <div class="refresh-note">Not linked publicly — keep this URL private<button onclick="loadClients()">Refresh</button></div>
  </div>

  <div id="loading" class="loading-msg">Loading clients…</div>

  <div class="columns" id="columns" style="display:none;">
    <div class="column leads">
      <div class="column-head"><h2>Leads</h2><span class="count mono" id="count-lead">0</span></div>
      <div class="column-body" id="col-lead"></div>
    </div>
    <div class="column active">
      <div class="column-head"><h2>Active</h2><span class="count mono" id="count-active">0</span></div>
      <div class="column-body" id="col-active"></div>
    </div>
    <div class="column paused">
      <div class="column-head"><h2>Paused</h2><span class="count mono" id="count-paused">0</span></div>
      <div class="column-body" id="col-paused"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const LIST_URL = "https://hook.us2.make.com/r952r5537uim78dt3aflvgq2nkmman2c";
  const UPDATE_URL = "https://hook.us2.make.com/hvltbleo2fkhtcmdtdc2edxes7kyy7ds";
  const KEY = "gjta5nQrpi8i1HBMLpK8FlXw8OXmwRTi";

  function todayStr(){
    return new Date().toISOString().slice(0,10);
  }

  function showToast(msg, isError){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => { t.className = 'toast'; }, 3200);
  }

  async function loadClients(){
    document.getElementById('loading').style.display = 'block';
    document.getElementById('columns').style.display = 'none';
    try {
      const res = await fetch(`${LIST_URL}?key=${KEY}`);
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      const records = await res.json();
      render(Array.isArray(records) ? records : []);
    } catch (err) {
      document.getElementById('loading').textContent = "Couldn't load clients — " + err.message;
    }
  }

  function esc(s){
    return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(records){
    const buckets = { lead: [], active: [], paused: [] };
    records.forEach(r => {
      const status = (r.status || 'lead').toLowerCase();
      if (buckets[status]) buckets[status].push(r);
      else buckets.lead.push(r);
    });

    ['lead','active','paused'].forEach(status => {
      const col = document.getElementById('col-' + status);
      const count = document.getElementById('count-' + status);
      col.innerHTML = '';
      count.textContent = buckets[status].length;
      if (buckets[status].length === 0) {
        col.innerHTML = '<div class="empty-msg">Nothing here right now.</div>';
        return;
      }
      buckets[status].forEach(r => col.appendChild(buildCard(r, status)));
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('columns').style.display = 'grid';
  }

  function buildCard(r, status){
    const card = document.createElement('div');
    card.className = 'card';

    let metaLines = [esc(r.address || 'No address on file'), esc(r.client_email || 'No email on file')];
    let flag = '';
    if (status === 'active') {
      flag = r.place_id
        ? '<span class="card-flag ok">Place ID verified</span>'
        : '<span class="card-flag missing">No Place ID — automations skipped</span>';
    }

    let actions = '';
    if (status === 'lead') {
      actions = `<button class="btn primary" onclick="toggleConvert('${r.key}')">Convert to Active</button>
                 <button class="btn danger" onclick="doDelete('${r.key}','${esc(r.business_name)}')">Delete</button>`;
    } else if (status === 'active') {
      actions = `<button class="btn" onclick="setStatus('${r.key}','paused')">Pause</button>
                 <button class="btn danger" onclick="doDelete('${r.key}','${esc(r.business_name)}')">Delete</button>`;
    } else if (status === 'paused') {
      actions = `<button class="btn primary" onclick="setStatus('${r.key}','active')">Reactivate</button>
                 <button class="btn danger" onclick="doDelete('${r.key}','${esc(r.business_name)}')">Delete</button>`;
    }

    card.innerHTML = `
      <div class="card-name">${esc(r.business_name || 'Unnamed')}</div>
      <div class="card-meta">${metaLines.join('<br>')}</div>
      ${flag}
      <div class="card-actions">${actions}</div>
      ${status === 'lead' ? buildConvertForm(r) : ''}
    `;
    return card;
  }

  function buildConvertForm(r){
    return `
      <div class="convert-form" id="convert-${r.key}">
        <label>Industry context (services, specialties)</label>
        <textarea id="ic-${r.key}"></textarea>
        <label>Brand voice notes</label>
        <textarea id="bv-${r.key}"></textarea>
        <label>Tracked keywords</label>
        <div class="kw-row">
          <input placeholder="Keyword 1" id="k1-${r.key}">
          <input placeholder="Keyword 2" id="k2-${r.key}">
          <input placeholder="Keyword 3" id="k3-${r.key}">
          <input placeholder="Keyword 4" id="k4-${r.key}">
        </div>
        <div class="card-actions" style="margin-top:14px;">
          <button class="btn primary" onclick="doConvert('${r.key}','${esc(r.business_name)}','${esc(r.client_email)}')">Save & Activate</button>
          <button class="btn" onclick="toggleConvert('${r.key}')">Cancel</button>
        </div>
      </div>`;
  }

  function toggleConvert(key){
    document.getElementById('convert-' + key).classList.toggle('show');
  }

  async function postUpdate(body){
    const params = new URLSearchParams({ key: KEY, today: todayStr(), ...body });
    const res = await fetch(UPDATE_URL, { method: 'POST', body: params });
    if (!res.ok) throw new Error('Request failed: ' + res.status);
    return res;
  }

  async function setStatus(recordKey, status){
    try {
      await postUpdate({ action: 'set_status', record_key: recordKey, status });
      showToast(status === 'active' ? 'Reactivated.' : 'Paused — automations will skip this client going forward.');
      loadClients();
    } catch (err) {
      showToast("Couldn't update: " + err.message, true);
    }
  }

  async function doDelete(recordKey, name){
    if (!confirm(`Permanently delete ${name}? This removes them from the pipeline entirely — this can't be undone.`)) return;
    try {
      await postUpdate({ action: 'delete', record_key: recordKey });
      showToast(name + ' deleted.');
      loadClients();
    } catch (err) {
      showToast("Couldn't delete: " + err.message, true);
    }
  }

  async function doConvert(recordKey, businessName, clientEmail){
    const body = {
      action: 'convert',
      record_key: recordKey,
      business_name: businessName,
      client_email: clientEmail,
      industry_context: document.getElementById('ic-' + recordKey).value,
      brand_voice: document.getElementById('bv-' + recordKey).value,
      keyword_1: document.getElementById('k1-' + recordKey).value,
      keyword_2: document.getElementById('k2-' + recordKey).value,
      keyword_3: document.getElementById('k3-' + recordKey).value,
      keyword_4: document.getElementById('k4-' + recordKey).value,
      keyword_5: ''
    };
    try {
      await postUpdate(body);
      showToast(businessName + ' activated — onboarding email sent.');
      loadClients();
    } catch (err) {
      showToast("Couldn't activate: " + err.message, true);
    }
  }

  loadClients();
</script>

</body>
</html>
